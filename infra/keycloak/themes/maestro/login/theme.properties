parent=keycloak
import=common/keycloak
styles=css/styles.css

# ── Internationalisation ──────────────────────────────────────
# Active la prise en compte des fichiers messages_*.properties
# dans /messages/. Sans ça, Keycloak ignore nos surcharges.
# La locale par défaut est définie au niveau du realm
# (Realm settings → Localization → Default locale = fr).
locales=fr,en
