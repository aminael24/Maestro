# ═══════════════════════════════════════════════════════════════════════════
#  Maestro — CI/CD Pipeline complet
# ═══════════════════════════════════════════════════════════════════════════
#
#  Stack de tests :
#
#    Frontend (React) :
#      - Jest + React Testing Library      → UNITAIRES
#      - Cypress                           → FONCTIONNELS (E2E avec backend)
#
#    Backend ApiGateway (.NET 8) :
#      - xUnit + Moq + FluentAssertions    → UNITAIRES
#      - xUnit + WebApplicationFactory     → INTÉGRATION
#
#    Backend WorkspaceService (.NET 8) :
#      - xUnit + Moq                       → UNITAIRES   (TODO: décommenter)
#      - xUnit + WebApplicationFactory     → INTÉGRATION (TODO: décommenter)
#
#    AIService (Python / FastAPI) :
#      - pytest                            → UNITAIRES + INTÉGRATION
#
#  Pour les tests Cypress E2E, le pipeline démarre le backend complet via
#  docker compose up (Keycloak, Postgres, ApiGateway, etc.) — exactement
#  comme sur votre machine locale.
#
#  Déclencheurs :
#    push sur main / dev
#    pull request vers main / dev
#    manuel via workflow_dispatch
# ═══════════════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # 1) FRONTEND — Tests unitaires Jest + build Vite
  # ═══════════════════════════════════════════════════════════════════════
  frontend-unit:
    name: Frontend · Jest + RTL (unitaires)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-bloquant)
        run: npm run lint || true

      - name: Tests unitaires Jest
        run: npx jest --ci --reporters=default --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-jest-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Build production
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # 2) BACKEND BUILD — Compilation .NET 8 de tous les microservices
  # ═══════════════════════════════════════════════════════════════════════
  backend-build:
    name: Backend · Build .NET 8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build — ApiGateway
        run: |
          dotnet restore services/ApiGateway/ApiGateway.csproj
          dotnet build   services/ApiGateway/ApiGateway.csproj -c Release --no-restore

      - name: Build — WorkspaceService
        run: |
          dotnet restore services/WorkspaceService/WorkspaceService.csproj
          dotnet build   services/WorkspaceService/WorkspaceService.csproj -c Release --no-restore

      - name: Build — RunnerService
        run: |
          dotnet restore services/RunnerService/RunnerService.csproj
          dotnet build   services/RunnerService/RunnerService.csproj -c Release --no-restore

      - name: Build — NotificationService
        run: |
          dotnet restore services/NotificationService/NotificationService.csproj
          dotnet build   services/NotificationService/NotificationService.csproj -c Release --no-restore

  # ═══════════════════════════════════════════════════════════════════════
  # 3) BACKEND UNIT TESTS — xUnit + Moq + FluentAssertions
  # ═══════════════════════════════════════════════════════════════════════
  backend-unit:
    name: Backend · xUnit unitaires
    needs: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: ApiGateway.UnitTests
        run: |
          dotnet test tests/ApiGateway.UnitTests/ApiGateway.UnitTests.csproj \
            -c Release \
            --logger "trx;LogFileName=apigateway-unit.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage"

      # ─────────────────────────────────────────────────────────────────
      # TODO: décommenter une fois que FakeKafkaProducer implémente bien
      # toutes les méthodes de IKafkaProducer (ProduceFileUpdateAsync...).
      # ─────────────────────────────────────────────────────────────────
      # - name: WorkspaceService.UnitTests
      #   run: |
      #     dotnet test services/WorkspaceService/tests/UnitTests/UnitTests.csproj \
      #       -c Release \
      #       --logger "trx;LogFileName=workspace-unit.trx" \
      #       --logger "console;verbosity=normal" \
      #       --results-directory ./test-results \
      #       --collect:"XPlat Code Coverage"

      - name: Upload résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results
          path: test-results
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════
  # 4) BACKEND INTEGRATION TESTS — xUnit + WebApplicationFactory
  # ═══════════════════════════════════════════════════════════════════════
  backend-integration:
    name: Backend · xUnit intégration
    needs: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: ApiGateway.IntegrationTests
        env:
          SKIP_JWKS_FETCH: "1"
        run: |
          dotnet test tests/ApiGateway.IntegrationTests/ApiGateway.IntegrationTests.csproj \
            -c Release \
            --logger "trx;LogFileName=apigateway-integration.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./test-results

      # ─────────────────────────────────────────────────────────────────
      # TODO: décommenter une fois que FakeKafkaProducer implémente bien
      # toutes les méthodes de IKafkaProducer (ProduceFileUpdateAsync...).
      # ─────────────────────────────────────────────────────────────────
      # - name: WorkspaceService.IntegrationTests
      #   run: |
      #     dotnet test services/WorkspaceService/tests/IntegrationTests/IntegrationTests.csproj \
      #       -c Release \
      #       --logger "trx;LogFileName=workspace-integration.trx" \
      #       --logger "console;verbosity=normal" \
      #       --results-directory ./test-results

      - name: Upload résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results
          path: test-results
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════
  # 5) PYTHON AISERVICE — pytest (FastAPI)
  # ═══════════════════════════════════════════════════════════════════════
  python-tests:
    name: AIService · pytest
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/AIService/requirements.txt

      - name: Install AIService dependencies
        working-directory: services/AIService
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run pytest si des tests existent
        working-directory: services/AIService
        run: |
          if find . -type d \( -name tests -o -name test \) \
              -not -path '*/__pycache__/*' \
              -not -path '*/.venv/*' \
              | grep -q .; then
            echo "Tests pytest trouvés — exécution"
            pytest -v --tb=short
          else
            echo "Aucun dossier tests/ dans AIService — skip"
            exit 0
          fi

  # ═══════════════════════════════════════════════════════════════════════
  # 6) CYPRESS E2E — Tests fonctionnels avec backend Docker complet
  #
  # Démarre tout le stack via docker compose (comme sur votre PC) :
  # Keycloak + Postgres + ApiGateway + Kafka + Zookeeper, puis Cypress.
  # ═══════════════════════════════════════════════════════════════════════
  cypress-e2e:
    name: Frontend · Cypress (fonctionnels)
    needs: frontend-unit
    runs-on: ubuntu-latest
    # E2E peut être instable (timing des services). Non-bloquant le temps
    # de stabiliser. Une fois stable, retirer cette ligne.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ─────────────────────────────────────────────────────────────────
      # Vérifier que les secrets nécessaires existent. Les vraies valeurs
      # SMTP / GROQ sont mises dans GitHub Secrets (Settings → Secrets).
      # Si non définis, on met des valeurs factices pour que les services
      # démarrent quand même (Cypress ne teste pas l'envoi de mail).
      # ─────────────────────────────────────────────────────────────────
      - name: Prepare .env for CI
        run: |
          cat > .env <<'ENVEOF'
          # Keycloak admin
          KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=admin
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=admin123

          # Keycloak DB
          KEYCLOAK_DB_NAME=keycloakdb
          KEYCLOAK_DB_USER=keycloak
          KEYCLOAK_DB_PASSWORD=keycloakpass

          # User DB
          USER_DB_NAME=userdb
          USER_DB_USER=userapp
          USER_DB_PASSWORD=userapppass

          # Keycloak URLs
          KEYCLOAK_REALM_URL=http://keycloak:8080/realms/maestro
          KEYCLOAK_TOKEN_ENDPOINT=http://keycloak:8080/realms/maestro/protocol/openid-connect/token
          KEYCLOAK_PUBLIC_URL=http://localhost:8080
          FRONTEND_URL=http://localhost:5173

          # SMTP (valeurs factices pour CI — pas d'email envoyé)
          SMTP_HOST=smtp.example.com
          SMTP_PORT=587
          SMTP_USERNAME=ci@example.com
          SMTP_PASSWORD=ci-password
          EMAIL_FROM=ci@example.com

          # AI (factice — secret réel à mettre dans GitHub Secrets si besoin)
          GROQ_API_KEY=ci-fake-key
          ENVEOF
          echo ".env créé pour la CI"

      # ─────────────────────────────────────────────────────────────────
      # Démarrer le backend via docker compose (les images sont buildées
      # depuis les Dockerfiles locaux comme sur votre PC).
      # ─────────────────────────────────────────────────────────────────
      - name: Démarrer le backend (docker compose)
        run: |
          docker compose up -d \
            keycloak-db \
            user-db \
            zookeeper \
            kafka \
            keycloak \
            api-gateway \
            workspace-service \
            ai-service \
            notification-service \
            runner-service
          echo "Services démarrés. Liste :"
          docker compose ps

      - name: Attendre que les services soient prêts
        run: |
          echo "Attente de l'ApiGateway sur http://localhost:5000..."
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null -w "%{http_code}" http://localhost:5000 | grep -qE "^(200|301|302|401|404)$"; then
              echo "✅ ApiGateway prêt après ${i} essais"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "❌ ApiGateway pas prêt après 90 essais — logs :"
              docker compose logs --tail 100 api-gateway
              exit 1
            fi
            sleep 2
          done

          echo "Attente de Keycloak sur http://localhost:8080..."
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/realms/maestro | grep -qE "^(200|404)$"; then
              echo "✅ Keycloak prêt après ${i} essais"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "⚠️  Keycloak pas prêt mais on continue"
              break
            fi
            sleep 2
          done

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run dev
          wait-on: "http://localhost:5173"
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/**/*.cy.js

      - name: Logs backend si échec
        if: failure()
        run: |
          echo "===== api-gateway ====="
          docker compose logs --tail 100 api-gateway || true
          echo "===== keycloak ====="
          docker compose logs --tail 100 keycloak || true
          echo "===== workspace-service ====="
          docker compose logs --tail 100 workspace-service || true

      - name: Arrêt du backend
        if: always()
        run: docker compose down -v

      - name: Upload screenshots si échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════
  # 7) DOCKER IMAGES — Build (et push sur main) frontend + microservices
  # ═══════════════════════════════════════════════════════════════════════
  docker-images:
    name: Docker · build images
    needs: [frontend-unit, backend-unit, backend-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: api-gateway
            context: services/ApiGateway
            dockerfile: services/ApiGateway/Dockerfile
          - name: workspace-service
            context: services/WorkspaceService
            dockerfile: services/WorkspaceService/Dockerfile
          - name: runner-service
            context: services/RunnerService
            dockerfile: services/RunnerService/Dockerfile
          - name: notification-service
            context: services/NotificationService
            dockerfile: services/NotificationService/Dockerfile
          - name: ai-service
            context: services/AIService
            dockerfile: services/AIService/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (uniquement sur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/maestro-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (et push sur main) — ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ═══════════════════════════════════════════════════════════════════════
  # 8) RÉSUMÉ — Statut consolidé du pipeline
  # ═══════════════════════════════════════════════════════════════════════
  ci-result:
    name: CI · résumé global
    if: always()
    needs:
      - frontend-unit
      - backend-build
      - backend-unit
      - backend-integration
      - python-tests
      - cypress-e2e
      - docker-images
    runs-on: ubuntu-latest

    steps:
      - name: Statut des jobs
        run: |
          echo "MAESTRO CI/CD — résumé"
          echo "----------------------------------------"
          echo "Frontend Jest (unit)        : ${{ needs.frontend-unit.result }}"
          echo "Backend build               : ${{ needs.backend-build.result }}"
          echo "Backend xUnit unitaires     : ${{ needs.backend-unit.result }}"
          echo "Backend xUnit intégration   : ${{ needs.backend-integration.result }}"
          echo "AIService pytest            : ${{ needs.python-tests.result }} (non-bloquant)"
          echo "Cypress E2E (fonctionnels)  : ${{ needs.cypress-e2e.result }} (non-bloquant)"
          echo "Docker images               : ${{ needs.docker-images.result }}"
          echo "----------------------------------------"

          # Jobs bloquants — n'inclut PAS pytest et Cypress (continue-on-error).
          if [ "${{ needs.frontend-unit.result }}"       != "success" ] || \
             [ "${{ needs.backend-build.result }}"       != "success" ] || \
             [ "${{ needs.backend-unit.result }}"        != "success" ] || \
             [ "${{ needs.backend-integration.result }}" != "success" ] || \
             [ "${{ needs.docker-images.result }}"       != "success" ]; then
            echo "::error::Un ou plusieurs jobs bloquants ont échoué."
            exit 1
          fi
          echo "Tous les jobs bloquants ont réussi."