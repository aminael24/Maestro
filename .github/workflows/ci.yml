name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  frontend-unit:
    name: Frontend · Jest + RTL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint non bloquant
        run: npm run lint || true

      - name: Tests unitaires Jest
        run: npx jest --ci --reporters=default --coverage

      - name: Build production
        run: npm run build

  backend-build:
    name: Backend · Build .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build ApiGateway
        run: |
          dotnet restore services/ApiGateway/ApiGateway.csproj
          dotnet build services/ApiGateway/ApiGateway.csproj -c Release --no-restore

  backend-unit:
    name: Backend · Tests unitaires
    needs: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: ApiGateway.UnitTests
        run: |
          dotnet test tests/ApiGateway.UnitTests/ApiGateway.UnitTests.csproj \
            -c Release \
            --logger "console;verbosity=normal"

  backend-integration:
    name: Backend · Tests intégration
    needs: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: ApiGateway.IntegrationTests
        env:
          SKIP_JWKS_FETCH: "1"
        run: |
          dotnet test tests/ApiGateway.IntegrationTests/ApiGateway.IntegrationTests.csproj \
            -c Release \
            --logger "console;verbosity=normal"

  python-tests:
    name: AIService · pytest
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pytest si tests existent
        working-directory: services/AIService
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

          if find . -type d \( -name tests -o -name test \) | grep -q .; then
            pytest -v --tb=short
          else
            echo "Aucun test Python trouvé"
          fi

  cypress-e2e:
    name: Frontend · Cypress
    needs: frontend-unit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare .env for CI
        run: |
          cat > .env <<'ENVEOF'
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=admin123
          KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=admin
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=admin123

          KEYCLOAK_DB_NAME=keycloakdb
          KEYCLOAK_DB_USER=keycloak
          KEYCLOAK_DB_PASSWORD=keycloakpass

          USER_DB_NAME=userdb
          USER_DB_USER=userapp
          USER_DB_PASSWORD=userapppass

          KEYCLOAK_REALM_URL=http://keycloak:8080/realms/maestro
          KEYCLOAK_TOKEN_ENDPOINT=http://keycloak:8080/realms/maestro/protocol/openid-connect/token
          KEYCLOAK_PUBLIC_URL=http://localhost:8080
          FRONTEND_URL=http://localhost:5173

          SMTP_HOST=smtp.example.com
          SMTP_PORT=587
          SMTP_USERNAME=ci@example.com
          SMTP_PASSWORD=ci-password
          EMAIL_FROM=ci@example.com

          GROQ_API_KEY=ci-fake-key
          ENVEOF

      - name: Create Docker Compose CI override
        run: |
          cat > docker-compose.ci.override.yml <<'YAMLEOF'
          services:
            keycloak:
              healthcheck:
                test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080' || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 40
                start_period: 90s
          YAMLEOF

      - name: Start backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d \
            keycloak-db \
            user-db \
            workspace-db \
            zookeeper \
            kafka \
            keycloak

          echo "Attente Keycloak..."
          for i in $(seq 1 120); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps keycloak | grep -q "healthy"; then
              echo "Keycloak healthy"
              break
            fi

            if [ $i -eq 120 ]; then
              echo "Keycloak non healthy"
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --tail 200 keycloak
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --tail 100 keycloak-db
              exit 1
            fi

            sleep 3
          done

          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml up -d api-gateway

          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps

      - name: Wait ApiGateway
        run: |
          echo "Attente ApiGateway..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5000 > /dev/null; then
              echo "ApiGateway prêt"
              break
            fi

            if [ $i -eq 90 ]; then
              echo "ApiGateway non prêt"
              docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --tail 200 api-gateway
              exit 1
            fi

            sleep 2
          done

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run dev
          wait-on: "http://localhost:5173"
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/**/*.cy.js

      - name: Logs backend si échec
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml ps || true
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --tail 200 keycloak || true
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --tail 200 api-gateway || true
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml logs --tail 100 keycloak-db || true

      - name: Stop backend
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.override.yml down -v || true

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 14

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 14

  docker-images:
    name: Docker · build images
    needs: [frontend-unit, backend-unit, backend-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: api-gateway
            context: services/ApiGateway
            dockerfile: services/ApiGateway/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/maestro-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  ci-result:
    name: CI · résumé global
    if: always()
    needs:
      - frontend-unit
      - backend-build
      - backend-unit
      - backend-integration
      - python-tests
      - cypress-e2e
      - docker-images
    runs-on: ubuntu-latest

    steps:
      - name: Résumé
        run: |
          echo "Frontend Jest      : ${{ needs.frontend-unit.result }}"
          echo "Backend build      : ${{ needs.backend-build.result }}"
          echo "Backend unit       : ${{ needs.backend-unit.result }}"
          echo "Backend integration: ${{ needs.backend-integration.result }}"
          echo "Python tests       : ${{ needs.python-tests.result }}"
          echo "Cypress            : ${{ needs.cypress-e2e.result }}"
          echo "Docker images      : ${{ needs.docker-images.result }}"

          if [ "${{ needs.frontend-unit.result }}" != "success" ] || \
             [ "${{ needs.backend-build.result }}" != "success" ] || \
             [ "${{ needs.backend-unit.result }}" != "success" ] || \
             [ "${{ needs.backend-integration.result }}" != "success" ] || \
             [ "${{ needs.docker-images.result }}" != "success" ]; then
            exit 1
          fi